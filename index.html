<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance & Fitness Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Finance & Fitness Tracker</h1>

    <div id="menu" class="panel">
      <button id="btnProfile">1. Set Up / Update Profile</button>
      <button id="btnSalary">2. Finance: Log Salary</button>
      <button id="btnUtility">3. Finance: Log Utility Expense</button>
      <button id="btnSummary">4. Finance: View Monthly Summary</button>
      <button id="btnSingle">5. Fitness: Log Single Exercise</button>
      <button id="btnPreset">6. Fitness: Log Preset Routine</button>
      <button id="btnExport">Export DB (JSON)</button>
      <button id="btnImport">Import DB (JSON)</button>
    </div>

    <section id="output" class="panel">
      <pre id="log" aria-live="polite"></pre>
    </section>

    <footer class="panel small">
      <p>Data is stored in your browser (localStorage). Export to keep backups. Hosted on GitHub Pages as a static site.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
